[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bidsforge"
version = "1.1.0"
description = "BIDS-based iEEG analysis pipeline"
requires-python = ">=3.10"
dependencies = [
    "pybids>=0.16",
    "pydantic>=2.0",
    "joblib>=1.3",
    "mne>=1.11",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyfftw>=0.13",
    "h5py>=3.0",
    "pybv>=0.4",
    "tqdm>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-qt>=4.0",
    "PySide6>=6.5",
    "matplotlib>=3.7",
]
viz = [
    "PySide6>=6.5",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bidsforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/_pytest_tmp", "tests/_script_tmp"]
